[project]
name = "replyas"
version = "0.1.0"
description = "Keep replying from you@yourdomain.com inside Gmail after Send-as goes away."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "argon2-cffi>=23.1",
    "aiosmtpd>=1.4.6",
    "aiosmtplib>=3.0",
    "dkimpy>=1.1.8",
    "authheaders>=0.16",
    "pyspf>=2.0.14",
    "dnspython>=2.6",
    "cryptography>=43",
    "stripe>=10.0",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv]
package = false
